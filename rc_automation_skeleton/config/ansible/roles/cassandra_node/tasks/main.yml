- name: Install build and runtime dependencies
  apt:
    name:
      - openjdk-17-jdk
      - ant
      - maven
      - build-essential
      - xfsprogs
      - netcat-openbsd
    state: present

- name: Determine root block device parent
  shell: |
    set -euo pipefail
    ROOT_SRC=$(findmnt -n -o SOURCE /)
    lsblk -no PKNAME "$ROOT_SRC" 2>/dev/null || true
  args:
    executable: /bin/bash
  register: root_parent
  changed_when: false

- name: List NVMe disks
  shell: |
    set -euo pipefail
    lsblk -nd -o NAME,TYPE | awk '$2=="disk"{print $1}' | grep -E '^nvme' || true
  args:
    executable: /bin/bash
  register: nvme_disks
  changed_when: false

- name: Select instance-store NVMe disk
  set_fact:
    instance_nvme_disk: "{{ (nvme_disks.stdout_lines | reject('equalto', root_parent.stdout | trim) | list | first) | default('') }}"

- name: Fail if no instance-store NVMe disk found
  fail:
    msg: "No instance-store NVMe disk found on host {{ inventory_hostname }}. root_parent={{ root_parent.stdout | trim }} disks={{ nvme_disks.stdout_lines }}"
  when: instance_nvme_disk == ''

- name: Create NVMe mount point
  file:
    path: "{{ nvme_mount_point }}"
    state: directory
    mode: "0755"

- name: Check filesystem on NVMe disk
  shell: |
    set -euo pipefail
    blkid /dev/{{ instance_nvme_disk }} >/dev/null 2>&1 && echo has_fs || echo no_fs
  args:
    executable: /bin/bash
  register: fs_check
  changed_when: false

- name: Format NVMe disk with XFS
  filesystem:
    fstype: xfs
    dev: "/dev/{{ instance_nvme_disk }}"
  when: fs_check.stdout.strip() == "no_fs"

- name: Read NVMe UUID
  command: blkid -s UUID -o value /dev/{{ instance_nvme_disk }}
  register: nvme_uuid
  changed_when: false

- name: Mount NVMe disk
  mount:
    path: "{{ nvme_mount_point }}"
    src: "UUID={{ nvme_uuid.stdout }}"
    fstype: xfs
    opts: "defaults,noatime"
    state: mounted

- name: Create Cassandra NVMe directories
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ cassandra_dirs.hints }}"
    - "{{ cassandra_dirs.data }}"
    - "{{ cassandra_dirs.metadata }}"
    - "{{ cassandra_dirs.commitlog }}"
    - "{{ cassandra_dirs.cdc_raw }}"
    - "{{ cassandra_dirs.saved_caches }}"

- name: Create Cassandra log directory
  file:
    path: /var/log/cassandra
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Ensure Cassandra install dir exists
  file:
    path: "{{ cassandra_install_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Clone Cassandra repository
  git:
    repo: "{{ cassandra_repo }}"
    dest: "{{ cassandra_install_dir }}"
    version: "{{ cassandra_branch }}"
    force: yes
  become: false

- name: Build Cassandra from source
  shell: |
    set -euo pipefail
    cd "{{ cassandra_install_dir }}"
    ant clean jar
  args:
    executable: /bin/bash
  become: false

- name: Compute effective seed list
  set_fact:
    effective_cassandra_seeds: "{{ cassandra_seeds if (cassandra_seeds | length > 0) else [hostvars[groups['cassandra'][0]].private_ip] }}"

- name: Restore stock cassandra.yaml from repository
  shell: |
    set -euo pipefail
    cd "{{ cassandra_install_dir }}"
    git checkout -- conf/cassandra.yaml
  args:
    executable: /bin/bash
  become: false

- name: Copy cassandra.yaml patch script
  copy:
    dest: /tmp/patch_cassandra_yaml.py
    mode: "0755"
    content: |
      import sys
      import yaml

      path = sys.argv[1]
      cluster_name = sys.argv[2]
      listen_address = sys.argv[3]
      broadcast_rpc_address = sys.argv[4]
      seed_ips = sys.argv[5]
      hints_dir = sys.argv[6]
      data_dir = sys.argv[7]
      metadata_dir = sys.argv[8]
      commitlog_dir = sys.argv[9]
      cdc_raw_dir = sys.argv[10]
      saved_caches_dir = sys.argv[11]
      endpoint_snitch = sys.argv[12]

      with open(path) as f:
          data = yaml.safe_load(f)

      data["cluster_name"] = cluster_name
      data["hints_directory"] = hints_dir
      data["data_file_directories"] = [data_dir]
      data["metadata_directory"] = metadata_dir
      data["commitlog_directory"] = commitlog_dir
      data["cdc_raw_directory"] = cdc_raw_dir
      data["saved_caches_directory"] = saved_caches_dir
      data["seed_provider"] = [{
          "class_name": "org.apache.cassandra.locator.SimpleSeedProvider",
          "parameters": [{"seeds": seed_ips}]
      }]
      data["listen_address"] = listen_address
      data["rpc_address"] = "0.0.0.0"
      data["broadcast_rpc_address"] = broadcast_rpc_address
      data["endpoint_snitch"] = endpoint_snitch

      with open(path, "w") as f:
          yaml.safe_dump(data, f, sort_keys=False, default_flow_style=False)

- name: Patch cassandra.yaml safely
  command: >
    python3 /tmp/patch_cassandra_yaml.py
    {{ cassandra_install_dir }}/conf/cassandra.yaml
    {{ cassandra_cluster_name }}
    {{ private_ip }}
    {{ private_ip }}
    {{ effective_cassandra_seeds | join(',') }}
    {{ cassandra_dirs.hints }}
    {{ cassandra_dirs.data }}
    {{ cassandra_dirs.metadata }}
    {{ cassandra_dirs.commitlog }}
    {{ cassandra_dirs.cdc_raw }}
    {{ cassandra_dirs.saved_caches }}
    {{ cassandra_endpoint_snitch }}

- name: Set MAX_HEAP_SIZE in cassandra-env.sh
  lineinfile:
    path: "{{ cassandra_install_dir }}/conf/cassandra-env.sh"
    regexp: '^MAX_HEAP_SIZE='
    line: 'MAX_HEAP_SIZE="{{ cassandra_max_heap }}"'

- name: Set HEAP_NEWSIZE in cassandra-env.sh
  lineinfile:
    path: "{{ cassandra_install_dir }}/conf/cassandra-env.sh"
    regexp: '^HEAP_NEWSIZE='
    line: 'HEAP_NEWSIZE="{{ cassandra_heap_newsize }}"'

- name: Set LOCAL_JMX to no
  lineinfile:
    path: "{{ cassandra_install_dir }}/conf/cassandra-env.sh"
    regexp: '^LOCAL_JMX='
    line: 'LOCAL_JMX=no'
    create: yes

- name: Remove conflicting explicit JMX JVM option line if present
  replace:
    path: "{{ cassandra_install_dir }}/conf/cassandra-env.sh"
    regexp: '^JVM_OPTS="\$JVM_OPTS -Dcom\.sun\.management\.jmxremote\.port=.*"$\n?'
    replace: ''

- name: Install cassandra systemd unit
  copy:
    dest: /etc/systemd/system/cassandra.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apache Cassandra (RC)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=forking
      User=ubuntu
      Group=ubuntu
      WorkingDirectory={{ cassandra_install_dir }}
      Environment=JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      ExecStart={{ cassandra_install_dir }}/bin/cassandra -p /run/cassandra.pid
      ExecStop={{ cassandra_install_dir }}/bin/nodetool stopdaemon
      Restart=on-failure
      RestartSec=10
      LimitNOFILE=100000

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Enable cassandra service
  systemd:
    name: cassandra
    enabled: true

- name: Start Cassandra
  systemd:
    name: cassandra
    state: restarted
  when: cassandra_start_enabled | default(true)

- name: Wait for CQL port 9042
  wait_for:
    host: "{{ private_ip }}"
    port: 9042
    delay: 10
    timeout: 600
  when: cassandra_start_enabled | default(true)

- name: Wait for local node to report joined
  shell: |
    set -euo pipefail
    "{{ cassandra_install_dir }}/bin/nodetool" info | grep -v "(node is not joined to the cluster)" >/dev/null
  args:
    executable: /bin/bash
  register: join_ok
  retries: 30
  delay: 10
  until: join_ok.rc == 0
  changed_when: false
  when: cassandra_start_enabled | default(true)
