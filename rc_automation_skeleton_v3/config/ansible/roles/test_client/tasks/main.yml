- name: Install Java and tooling for test client
  apt:
    name:
      - openjdk-17-jdk
      - maven
    state: present

- name: Create tools directory
  file:
    path: "/opt/rc-tools"
    state: directory
    mode: "0755"

- name: Install NoSQLBench (download placeholder)
  shell: |
    set -euo pipefail
    cd /opt/rc-tools
    # Replace with a pinned version URL when you decide.
    # Example pattern:
    # curl -L -o nosqlbench.jar https://github.com/nosqlbench/nosqlbench/releases/download/<TAG>/nb.jar
    echo "TODO: download NoSQLBench jar (pin version)"
  args:
    executable: /bin/bash

- name: Clone jvector-bench source (optional)
  git:
    repo: "{{ jvector_bench_repo }}"
    dest: "/opt/rc-tools/jvector"
    version: "{{ jvector_bench_ref }}"
    force: yes
  when: build_tools_from_source | bool

- name: Build jvector-bench (optional placeholder)
  shell: |
    set -euo pipefail
    cd /opt/rc-tools/jvector
    mvn -q -DskipTests package
  args:
    executable: /bin/bash
  when: build_tools_from_source | bool

- name: Note dataset bucket
  debug:
    msg: "Datasets expected in s3://{{ dataset_s3_bucket }}/... (fetch tasks TBD)"
